<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8bfd"/>
      <stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="380" fill="#0f1420"/>
  <text x="440" y="34" fill="#8fa3c0" font-size="13" text-anchor="middle">dsh-quark 结构示意：两处界面入口 + 一套 agent 工具</text>

  <!-- 左侧栏 -->
  <rect x="24" y="60" width="56" height="292" rx="10" fill="#161d2c" stroke="#26314a"/>
  <text x="52" y="80" fill="#5f7191" font-size="10" text-anchor="middle">左侧栏</text>
  <circle cx="52" cy="106" r="14" fill="#1c2536" stroke="#26314a"/>
  <circle cx="52" cy="142" r="14" fill="url(#icon)"/>
  <path d="M46 142l6 6 6-6M52 136v8" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="178" r="14" fill="#1c2536" stroke="#26314a"/>

  <!-- 主面板 -->
  <rect x="96" y="60" width="330" height="292" rx="10" fill="#161d2c" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="112" y="82" fill="#7fb0ff" font-size="11">主面板（左侧栏进来）</text>
  <circle cx="120" cy="106" r="13" fill="#26314a"/>
  <text x="120" y="110" fill="#c9d6ea" font-size="11" text-anchor="middle">Q</text>
  <text x="142" y="104" fill="#e6edf7" font-size="12">昵称 · 88VIP</text>
  <text x="142" y="120" fill="#6d7f9c" font-size="10">2.99 TB / 6 TB</text>
  <rect x="112" y="134" width="298" height="24" rx="6" fill="#1c2536" stroke="#26314a"/>
  <text x="122" y="150" fill="#56657e" font-size="10">搜索文件名…</text>
  <rect x="112" y="168" width="298" height="22" rx="5" fill="#1c2536"/>
  <text x="122" y="183" fill="#7d8ea8" font-size="10">📁 来自：分享</text>
  <rect x="112" y="194" width="298" height="22" rx="5" fill="#1c2536"/>
  <text x="122" y="209" fill="#7d8ea8" font-size="10">📄 report.pdf</text>
  <text x="316" y="209" fill="#4a8cf7" font-size="9">引用到会话</text>
  <rect x="112" y="300" width="298" height="36" rx="7" fill="#1c2536" stroke="#26314a"/>
  <text x="122" y="322" fill="#7d8ea8" font-size="9">新建文件夹 · 上传 · 下载 · 移动 · 分享 · 批量重命名 · 相册整理 · 整批归类 · AI 总结</text>

  <!-- 中间对话 -->
  <rect x="446" y="60" width="240" height="292" rx="10" fill="#161d2c" stroke="#26314a"/>
  <text x="462" y="82" fill="#5f7191" font-size="11">对话</text>
  <rect x="462" y="96" width="180" height="44" rx="8" fill="#1c2536"/>
  <text x="472" y="114" fill="#9fb0c8" font-size="10">总结一下我刚引用的那个文件</text>
  <text x="472" y="130" fill="#6d7f9c" font-size="9">→ agent 调用 quark_summary</text>
  <rect x="462" y="150" width="180" height="30" rx="8" fill="#101828" stroke="#26314a"/>
  <text x="472" y="169" fill="#56657e" font-size="9">输入框（Lexical）</text>

  <!-- 右侧栏 -->
  <rect x="706" y="60" width="150" height="292" rx="10" fill="#161d2c" stroke="#3d8bfd" stroke-width="1.5"/>
  <text x="718" y="82" fill="#7fb0ff" font-size="11">右侧栏</text>
  <rect x="718" y="92" width="126" height="20" rx="5" fill="#1c2536" stroke="#3d8bfd"/>
  <text x="781" y="106" fill="#9fc4ff" font-size="9" text-anchor="middle">夸克网盘</text>
  <rect x="718" y="120" width="126" height="18" rx="4" fill="#101828"/>
  <text x="724" y="133" fill="#7d8ea8" font-size="9">📁 我的备份</text>
  <rect x="718" y="142" width="126" height="18" rx="4" fill="#101828"/>
  <text x="724" y="155" fill="#7d8ea8" font-size="9">📄 notes.docx</text>
  <text x="724" y="154" fill="#4a8cf7" font-size="0">.</text>
  <text x="718" y="180" fill="#4a8cf7" font-size="8">行内：引用到会话</text>
  <text x="718" y="196" fill="#6d7f9c" font-size="8">直接进当前对话</text>

  <!-- 箭头 -->
  <path d="M426 206h16" stroke="#3d8bfd" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M482 250c0-20 20-30 40-30" stroke="none"/>
  <path d="M700 150c-8 0-14 4-14 10" stroke="#3d8bfd" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>

  <text x="440" y="372" fill="#4a5670" font-size="10" text-anchor="middle">左侧栏 = 主面板（浏览/管理） · 右侧栏 = 会话内窄版（引用/总结） · 两边共用同一个 /api/quark 与 13 个 quark_* 工具</text>
</svg>
